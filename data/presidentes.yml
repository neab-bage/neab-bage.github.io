# ---------------------------------------------------------------------------
# Linha do tempo dos presidentes do NEAB — do mais recente ao primeiro.
#
# FONTES
#   (a) Levantamento do Eng. Márcio Marun Gomes para a primeira edição do
#       "Ellas Revista — Projeto & Construção", caderno do NEAB com o Jornal
#       Minuano, março de 2026. É dele a numeração de 1 a 20 (campo `n`),
#       em ordem cronológica crescente.
#   (b) Registros datados do CREA-RS e do Jornal Minuano, que permitiram
#       atribuir período a alguns mandatos (campo `fonte`).
#
# COMO A ORDEM FOI MONTADA: as entradas datadas vêm no topo, por ano decrescente;
# abaixo delas, a numeração do Ellas em ordem inversa (20 → 1). O mandato nº 20,
# de Márcio Marun Gomes, foi identificado como o de 2006 — ele próprio declarou
# ao Jornal Minuano ter sido presidente "pela primeira vez" naquele ano — e por
# isso aparece uma única vez, com o período.
#
# NOMES UNIFICADOS: o Jornal Minuano grafou "Luiz Antônio Arla" e o CREA-RS, "Antônio Luiz
# Arla da Silva". É a mesma pessoa, associada ao núcleo; vale a grafia do quadro de associados.
# O levantamento do Ellas grafou "Volmir Oliveira" e o guia Aprova Fácil, "Volmir Silveira":
# é a mesma pessoa, Volmir Oliveira Silveira, como consta em documentos do DAEB que ele
# assinou como diretor-geral. A foto vem da ficha dele no quadro de associados.
#
# FOTO: resolvida automaticamente pelo nome, contra static/img/associados/.
# Quando o nome no quadro de associados for diferente, use o campo `foto` com
# o slug correto.
# ---------------------------------------------------------------------------

titulo: "Galeria de Presidentes"
# intro: removido da página — procedência interessa a quem mantém o site, não a quem o visita.
# As fontes de cada mandato seguem no campo `fonte` de cada entrada, para consulta e revisão,
# mas não são exibidas.
galeria: >-
  A <strong>Galeria de Presidentes</strong> foi inaugurada em 2 de dezembro de 2016 na sede do
  núcleo, nas dependências da Inspetoria do CREA-RS de Bagé, onde os retratos estão expostos.
nota: >-
  A reconstituição segue em curso. Falta identificar os períodos da maior parte dos
  mandatos anteriores a 2006 — e, no intervalo já mapeado, os anos de 2011 a 2014.
  Quem puder contribuir com documentos, atas ou registros fotográficos pode falar
  com a Diretoria.

