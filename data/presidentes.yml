# ---------------------------------------------------------------------------
# Relação de ex-presidentes do NEAB.
#
# FONTE: levantamento feito pelo Eng. Márcio Marun Gomes para a primeira edição do
# "Ellas Revista — Projeto & Construção", caderno publicado em março de 2026 pela
# parceria entre o NEAB e o Jornal Minuano, que registra a trajetória dos presidentes
# da entidade.
#
# A numeração reproduz a ordem do levantamento. Os períodos de mandato só constam
# onde foram identificados; a cronologia completa, incluindo eventuais reeleições,
# ainda está sendo reconstituída — ver `nota` abaixo.
#
# Ao acrescentar ou corrigir, registre a fonte no campo `fonte` da entrada.
# ---------------------------------------------------------------------------

titulo: "Ex-presidentes"
intro: >-
  Quem presidiu o núcleo desde a fundação, em 1968. A relação resulta do levantamento
  feito para o caderno <em>Ellas Revista — Projeto &amp; Construção</em>, publicado em
  março de 2026 pela parceria entre o NEAB e o Jornal Minuano.
galeria: >-
  O NEAB mantém uma <strong>Galeria de Presidentes</strong>, inaugurada em 2 de dezembro de 2016,
  na sede do núcleo.

nota: >-
  A reconstituição da cronologia segue em curso. Faltam identificar os períodos de
  alguns mandatos — em especial entre 2011 e 2014 e entre 2021 e 2022 — e confirmar
  eventuais reeleições. Quem puder contribuir com documentos, atas ou registros
  fotográficos pode falar com a Diretoria.

