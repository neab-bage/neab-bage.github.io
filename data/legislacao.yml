# ---------------------------------------------------------------------------
# Legislação de referência para o exercício profissional e para os processos
# de aprovação em Bagé.
#
# REGRA: links apontam para a FONTE OFICIAL (Planalto, Assembleia do RS, CBMRS,
# CONFEA, CAU/BR, Prefeitura). Só hospedar cópia em static/documentos/ quando
# não houver fonte oficial estável na internet.
#
# Cada item: titulo, ementa, url (opcional), fonte (quem publica), nota (opcional).
# Itens sem `url` aparecem como referência, sem link — use para o que ainda não
# foi localizado em fonte oficial.
#
# CONFERIR PERIODICAMENTE: norma revogada ou link quebrado leva o profissional a
# protocolar errado. Ver a seção de pendências no fim deste arquivo.
# ---------------------------------------------------------------------------

titulo: "Legislação"
chamada: "Normas de referência"
intro: >-
  As normas que regem o exercício profissional e os processos de aprovação em Bagé.
  Os links levam às fontes oficiais, onde o texto está sempre atualizado.
aviso: >-
  Esta página é um índice de consulta, não uma fonte oficial. Antes de protocolar,
  confirme a versão vigente no órgão responsável — as normas mudam, em especial as
  estaduais de prevenção de incêndio e as municipais de uso do solo.

blocos:
  - id: exercicio
    titulo: "Exercício profissional"
    resumo: >-
      Define quem pode assinar o quê, e como a responsabilidade técnica é registrada.
    itens:
      - titulo: "Lei nº 5.194/1966"
        ementa: "Regula o exercício das profissões de engenheiro, arquiteto e engenheiro-agrônomo. É a lei que cria o sistema CONFEA/CREA."
        url: "https://www.planalto.gov.br/ccivil_03/leis/l5194.htm"
        fonte: "Planalto"
      - titulo: "Lei nº 6.496/1977"
        ementa: "Institui a Anotação de Responsabilidade Técnica (ART) e autoriza a criação da Mútua."
        url: "https://www.planalto.gov.br/ccivil_03/leis/L6496.htm"
        fonte: "Planalto"
      - titulo: "Lei nº 12.378/2010"
        ementa: "Regulamenta o exercício da arquitetura e urbanismo e cria o CAU/BR e os CAUs estaduais. É a norma que separa as atribuições de arquitetos das do sistema CONFEA/CREA."
        url: "https://www.planalto.gov.br/ccivil_03/_Ato2007-2010/2010/Lei/L12378.htm"
        fonte: "Planalto"
      - titulo: "Resolução CONFEA nº 218/1973"
        ementa: "Discrimina as atividades das diferentes modalidades da engenharia. É a referência para saber o que cada modalidade pode assinar."
        fonte: "CONFEA"
        nota: "PENDENTE: localizar o endereço estável no portal do CONFEA."
      - titulo: "Resolução CONFEA nº 1.137/2023"
        ementa: "Dispõe sobre a ART, o acervo técnico-profissional e o acervo operacional."
        fonte: "CONFEA"
        nota: "PENDENTE: localizar o endereço estável no portal do CONFEA."
      - titulo: "Resoluções CAU/BR nº 21/2012 e nº 91/2014"
        ementa: "Atividades e atribuições do arquiteto e urbanista, e o Registro de Responsabilidade Técnica (RRT)."
        fonte: "CAU/BR"
        nota: "PENDENTE: localizar os endereços estáveis no portal do CAU/BR."

  - id: incendio
    titulo: "Segurança contra incêndio"
    resumo: >-
      Base do PPCI, exigido no protocolo de projeto arquitetônico comercial,
      institucional e multifamiliar.
    itens:
      - titulo: "Lei Complementar estadual nº 14.376/2013"
        ementa: "Estabelece as normas de segurança, prevenção e proteção contra incêndios nas edificações e áreas de risco do Rio Grande do Sul. Conhecida como Lei Kiss."
        url: "https://www.bombeiros.rs.gov.br/upload/arquivos/202212/30115130-lec-n-14-376.pdf"
        fonte: "Corpo de Bombeiros Militar do RS"
        nota: "Texto consolidado publicado pelo CBMRS. A lei recebeu várias alterações desde 2013 — confirme a versão vigente antes de protocolar."
      - titulo: "Decreto estadual nº 51.803/2014"
        ementa: "Regulamenta a Lei Complementar 14.376/2013 e remete às Resoluções Técnicas do CBMRS, que detalham cada medida de segurança."
        fonte: "Governo do Estado do RS"
        nota: "PENDENTE: localizar o endereço oficial do texto consolidado."

  - id: urbanismo
    titulo: "Urbanismo e edificações"
    resumo: >-
      Normas federais que estruturam a política urbana e as exigências de projeto.
    itens: []
    nota: >-
      PENDENTE: Estatuto da Cidade (10.257/2001), parcelamento do solo (6.766/1979),
      acessibilidade (13.146/2015 e NBR 9050), mobilidade urbana (12.587/2012),
      segurança contra incêndio (13.425/2017).

  - id: municipal
    titulo: "Bagé — urbanismo e edificações"
    resumo: >-
      A legislação que a Geplan aplica na análise dos processos. Os arquivos abaixo são
      cópias de consulta, digitalizadas; o texto oficial é o da Câmara Municipal de Bagé.
      Confira sempre a vigência e as alterações posteriores antes de projetar.
    itens:
      - titulo: "Lei Complementar nº 025/2007 — Plano Diretor"
        ementa: "Institui o Plano Diretor de Desenvolvimento Urbano e Ambiental de Bagé. É a norma central do zoneamento, dos índices construtivos e do uso do solo. 94 páginas."
        url: "static/documentos/leis/plano-diretor-lc-025-2007.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei Complementar nº 064/2017"
        ementa: "Acrescenta o § 3º ao art. 117 da Lei Complementar nº 025/2007."
        url: "static/documentos/leis/lc-064-2017-altera-plano-diretor.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Leis Complementares nº 054 e nº 055, de 23 de janeiro de 2015"
        ementa: "Alteram o uso de rural para urbano e estabelecem macrozona e zona para frações de campo."
        url: "static/documentos/leis/lc-054-2015.pdf"
        fonte: "Câmara de Vereadores de Bagé"
        nota: "A LC 055/2015 está em arquivo próprio, de mesmo teor para outra fração."
      - titulo: "PlanMob — Plano Diretor de Transporte e Mobilidade Urbana"
        ementa: "Plano de mobilidade do município, protocolado na Câmara de Vereadores. O volume de anexos, com 157 páginas, está em arquivo separado."
        url: "static/documentos/leis/planmob.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "PlanMob — anexos"
        ementa: "Mapas, tabelas e levantamentos que acompanham o plano de mobilidade."
        url: "static/documentos/leis/planmob-anexos.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei Municipal nº 1.762, de 17 de dezembro de 1973"
        ementa: "Primeiro Plano Diretor da cidade, com o zoneamento original e a hierarquia viária. Revogado, mas indispensável para entender a formação urbana e analisar edificações da época."
        url: "static/documentos/leis/lei-1762-1973-primeiro-plano-diretor.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei Municipal nº 4.919/2010"
        ementa: "Obriga as edificações do município a possuir Certidão de Inspeção Predial. É a base do check-list de inspeção predial do Guia Prático."
        fonte: "Prefeitura Municipal de Bagé"
        nota: "PENDENTE: obter o arquivo. É a única das citadas no Guia que ainda não está aqui."

  - id: tombamentos
    titulo: "Bens tombados pelo município"
    resumo: >-
      Vinte e três leis municipais declaram bens de Bagé patrimônio histórico, cultural ou
      ambiental. Intervir em qualquer um deles exige tratamento próprio. A lista está em ordem
      cronológica; o tombamento municipal é independente do tombamento federal do conjunto do
      centro histórico.
    itens:
      - titulo: "Lei nº 2.718/1991 — antiga Usina Elétrica"
        ementa: "Declara patrimônio cultural histórico do município o prédio da antiga Usina Elétrica de Bagé."
        url: "static/documentos/leis/lei-2718-1991.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 2.734/1991 — Instituto Municipal de Belas Artes Luis Simão Kalil"
        ementa: "Declara patrimônio histórico e cultural do município o prédio do instituto."
        url: "static/documentos/leis/lei-2734-1991.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 2.786/1991 — Zona de Proteção ao Patrimônio Cultural"
        ementa: "Cria a ZPC, no entorno da Catedral São Sebastião. Define a área em que as intervenções passam por análise específica."
        url: "static/documentos/leis/lei-2786-1991.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 2.808/1992 — Hidráulica Municipal"
        ementa: "Declara patrimônio cultural histórico os dois edifícios e o jardim da Hidráulica Municipal de Bagé."
        url: "static/documentos/leis/lei-2808-1992.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 2.839/1992 — Conselho Municipal de Preservação"
        ementa: "Cria o Conselho Municipal de Preservação do Patrimônio Histórico, Cultural e Ambiental, a quem cabe definir a área de entorno dos bens tombados."
        url: "static/documentos/leis/lei-2839-1992.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Leis nº 2.941/1993 e nº 3.079/1994 — Antigo Seminário"
        ementa: "Declaram patrimônio histórico e cultural o conjunto de prédios conhecido como Antigo Seminário. A segunda altera a ementa e o art. 1º da primeira."
        url: "static/documentos/leis/lei-2941-1993.pdf"
        fonte: "Prefeitura Municipal de Bagé"
        nota: "A lei alteradora, nº 3.079/1994, está em arquivo próprio."
      - titulo: "Lei nº 2.946/1993 — prédio da avenida Sete de Setembro, 1051"
        ementa: "Declara patrimônio histórico e cultural o prédio de propriedade particular localizado no endereço."
        url: "static/documentos/leis/lei-2946-1993.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.035/1993 — Clube Caixeral"
        ementa: "Declara patrimônio histórico e cultural o prédio do Clube Caixeral."
        url: "static/documentos/leis/lei-3035-1993.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.037/1993 — Banco Nacional do Comércio"
        ementa: "Declara patrimônio histórico e cultural os prédios onde funcionaram o Banco Nacional do Comércio e a Sociedade."
        url: "static/documentos/leis/lei-3037-1993.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.234/1995 — prédio no Loteamento Jardim do Castelo"
        ementa: "Declara patrimônio histórico e cultural o prédio da Rua Cornélio Martins Silva, 300."
        url: "static/documentos/leis/lei-3234-1995.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.260/1995 — Estádio Antônio Magalhães Rossel"
        ementa: "Declara patrimônio histórico e cultural o estádio do Guarany Futebol Clube."
        url: "static/documentos/leis/lei-3260-1995.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.261/1995 — Estádio Pedra Moura"
        ementa: "Declara patrimônio histórico e cultural o estádio do Grêmio Esportivo Bagé."
        url: "static/documentos/leis/lei-3261-1995.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.273/1995 — prédio da Rua Dr. ..."
        ementa: "Declara patrimônio histórico e cultural o prédio indicado na lei."
        url: "static/documentos/leis/lei-3273-1995.pdf"
        fonte: "Prefeitura Municipal de Bagé"
        nota: "PENDENTE: completar o endereço a partir do texto."
      - titulo: "Lei nº 3.289/1995 — arroios Tábua, Perez e Bagé"
        ementa: "Declara patrimônio natural, histórico e paisagístico de Bagé os três arroios."
        url: "static/documentos/leis/lei-3289-1995.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.472/1998 — Torres da Caieira Bageense"
        ementa: "Declara patrimônio histórico e cultural as torres, e autoriza o município a custear as obras de restauração."
        url: "static/documentos/leis/lei-3472-1998.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.456/1999 — Capela da Vila Industrial"
        ementa: "Declara patrimônio histórico e cultural a capela situada na Vila Industrial."
        url: "static/documentos/leis/lei-3456-1999.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.534/1999 — Igreja Santa Tereza"
        ementa: "Declara patrimônio histórico e cultural a igreja do bairro de mesmo nome."
        url: "static/documentos/leis/lei-3534-1999.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.608/2000 — Ponte Seca"
        ementa: "Declara patrimônio histórico a ponte dos trilhos conhecida como Ponte Seca."
        url: "static/documentos/leis/lei-3608-2000.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.611/2000 — Secretaria Municipal de Cultura"
        ementa: "Declara patrimônio histórico e cultural o prédio da Secretaria, antigo Palacete Pedro Osório."
        url: "static/documentos/leis/lei-3611-2000.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.685/2001 — Cerros de Bagé"
        ementa: "Declara patrimônio histórico, cultural e ambiental os Cerros de Bagé e promove seu tombamento."
        url: "static/documentos/leis/lei-3685-2001.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.686/2001 — Sociedade Portuguesa de Beneficência"
        ementa: "Declara patrimônio histórico e cultural o prédio da sociedade."
        url: "static/documentos/leis/lei-3686-2001.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.687/2001 — coreto e lago do Bairro Santa Tereza"
        ementa: "Tomba o coreto, o lago que o circunda e a área num raio de doze metros, além das ruínas do sobrado que foi residência do Visconde Ribeiro de Magalhães."
        url: "static/documentos/leis/lei-3687-2001.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 3.693/2001 — Coreto da Praça Silveira Martins"
        ementa: "Declara patrimônio histórico e cultural o coreto da praça."
        url: "static/documentos/leis/lei-3693-2001.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 4.378/2006 — Santa Casa de Caridade"
        ementa: "Tomba como patrimônio histórico e cultural o prédio da Santa Casa de Caridade de Bagé."
        url: "static/documentos/leis/lei-4378-2006.pdf"
        fonte: "Prefeitura Municipal de Bagé"
      - titulo: "Lei nº 4.387/2006 — antiga Estação Ferroviária e Prefeitura"
        ementa: "Tomba os prédios da antiga Estação Ferroviária, atual Centro Administrativo, e o da Prefeitura Municipal na Avenida General Osório."
        url: "static/documentos/leis/lei-4387-2006.pdf"
        fonte: "Prefeitura Municipal de Bagé"

  - id: patrimonio
    titulo: "Patrimônio histórico"
    resumo: >-
      Aplica-se a toda intervenção no conjunto tombado do centro de Bagé.
    itens:
      - titulo: "Instrução Normativa SEDAC/IPHAE nº 04/2026"
        ementa: "Documentos e critérios para intervenção em imóvel tombado ou em área de entorno. O Guia Prático do NEAB traz um resumo dos itens exigidos."
        fonte: "SEDAC/IPHAE"
        nota: "PENDENTE: localizar o endereço oficial."

  - id: tecnicas
    titulo: "Normas técnicas"
    resumo: >-
      As normas da ABNT citadas nos processos são de acesso pago e não podem ser
      reproduzidas aqui. Ficam listadas apenas como referência.
    itens: []
    nota: "PENDENTE: relacionar as NBR mais citadas nos processos de Bagé."
