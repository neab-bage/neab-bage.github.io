# ---------------------------------------------------------------------------
# Bibliografia sobre Bagé — livros, teses, dissertações, artigos e relatórios.
#
# REGRA DOS LINKS: só entra link para o texto que esteja publicado em acesso
# aberto pela própria fonte (repositório universitário, periódico, órgão
# público). Livro comercial entra como referência bibliográfica, sem link e sem
# capa — capa é material protegido. Nada de PDF hospedado aqui.
#
# Cada item: titulo, autores, publicacao, ano, resumo, url (opcional),
# fonte (onde está publicado), nota (opcional, para pendências).
#
# ESTA LISTA É UM COMEÇO. O levantamento foi feito em buscas abertas; a
# contribuição dos associados vale mais do que isso. Ver a chamada no fim da página.
# ---------------------------------------------------------------------------

titulo: "Biblioteca"
chamada: "Bagé em livros, teses e artigos"
intro: >-
  Referências sobre Bagé — sua história, sua arquitetura, seu território. Reunidas aqui
  porque estão espalhadas por repositórios universitários e catálogos que ninguém encontra
  por acaso. Onde o texto está em acesso aberto, o link leva ao documento completo.

chamada_contribuicao: >-
  <strong>Falta muita coisa.</strong> Se você conhece um livro, uma tese ou um relatório
  sobre Bagé que deveria estar aqui — ou é autor de um deles —, fale com a Diretoria.

secoes:
  - id: livros
    titulo: "Livros"
    itens:
      - titulo: "Pequenos detalhes de Bagé"
        autores: "Clarisse Ismério"
        publicacao: "Ediurcamp"
        ano: "2019"
        resumo: "A cidade contada pelos detalhes da sua arquitetura e do seu cotidiano. Publicado pela editora da Urcamp, com texto completo disponível."
        url: "https://www.urcamp.edu.br/storage/attachments/attachments/15cc1f2d755ab11556214487.pdf"
        fonte: "Urcamp"
      - titulo: "História de Bagé: novos olhares"
        autores: "Organização de G. F. Andrade, Maria Medianeira Padoin e Clarisse Ismério"
        publicacao: "Texto e Contexto, Bagé"
        ano: "2021"
        resumo: "Coletânea de estudos sobre a história da cidade, com capítulos sobre patrimônio, memória e as vilas operárias."
        fonte: "Edição comercial"
      - titulo: "Personalidades das Ruas de Bagé"
        autores: "Diones Piazer Franchi"
        publicacao: "Exclamação / Editora Renascença, Bagé"
        ano: "2024"
        resumo: "Quem são as pessoas que dão nome às ruas da cidade."
        fonte: "Edição comercial"

  - id: teses
    titulo: "Teses e dissertações"
    itens:
      - titulo: "Arquitetura bajeense: o delinear da modernidade, 1930–1970"
        autores: "Magali Nocchi Collares Gonçalves"
        publicacao: "Dissertação de mestrado, PROPAR — Programa de Pesquisa e Pós-Graduação em Arquitetura, Faculdade de Arquitetura da UFRGS. Orientação de Glenda Pereira da Cruz"
        ano: "2006"
        resumo: >-
          Estuda a arquitetura de Bagé do declínio do ecletismo à extinção gradual dos padrões
          estéticos modernos, a partir dos profissionais que a produziram. A autora é arquiteta
          associada ao NEAB.
        url: "https://lume.ufrgs.br/handle/10183/8623"
        fonte: "Lume — UFRGS"
      - titulo: "Entre Charqueadas: um caminho de memórias — diretrizes de preservação para as Vilas Santa Thereza e Industrial, Bagé/RS"
        autores: "Isadora Baptista Alves"
        publicacao: "Trabalho final de graduação, Faculdade de Arquitetura e Urbanismo da UFPel"
        ano: ""
        resumo: "Diretrizes de preservação para duas vilas operárias ligadas às charqueadas de Bagé."
        url: "https://wp.ufpel.edu.br/neab/trabalho-final-de-graduacao-patrimonio/"
        fonte: "Núcleo de Estudos de Arquitetura Brasileira — UFPel"
        nota: "PENDENTE: link direto para o texto completo e ano."

  - id: artigos
    titulo: "Artigos e relatórios"
    itens:
      - titulo: "O patrimônio urbano da rainha da fronteira: Bagé, RS"
        autores: "Ester Judite Bendjouya Gutierrez e Simone Neutzling"
        publicacao: "Revista Memória em Rede, Pelotas, v. 2, n. 5"
        ano: "2011"
        resumo: >-
          Resultado do inventário do centro de Bagé feito pela metodologia do SICG, do IPHAN:
          101 quarteirões e 2.620 prédios levantados, cerca de 1.300 deles apontados como de
          interesse histórico-cultural. É o estudo que fundamentou a proteção do Conjunto
          Histórico e Paisagístico, inscrito em 2013 no Livro Tombo do IPHAE sob o número 116.
        url: "https://periodicos.ufpel.edu.br/index.php/Memoria/article/view/9525/6339"
        fonte: "Periódicos UFPel"

  - id: onde
    titulo: "Onde procurar"
    descricao: >-
      Repositórios que reúnem produção acadêmica sobre a região e aceitam busca por
      “Bagé”. É por aqui que aparecem os trabalhos novos.
    itens:
