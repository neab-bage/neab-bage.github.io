        ano: ""
        resumo: "Artigos, livros, dissertações e teses da UFPel, incluindo o acervo da Faculdade de Arquitetura e Urbanismo."
        url: "https://guaiaca.ufpel.edu.br/"
        fonte: "UFPel"
      - titulo: "Lume — Repositório Digital da UFRGS"
        autores: ""
        publicacao: ""
