resumo: >-
  Um programa sobre a engenharia que está no cotidiano das pessoas — muitas vezes
  imperceptível, sempre essencial.

texto:
  - >-
    O Universo das Engenharias mostra como a engenharia está presente no dia a dia,
    muitas vezes de forma imperceptível, mas sempre essencial para o desenvolvimento da
    sociedade. A cada edição, aborda temas relevantes para a cidade e a região, com
    debates qualificados e entrevistas com especialistas, gestores e profissionais.
  - >-
    Da infraestrutura urbana à tecnologia que passa despercebida dentro de casa, cada
    edição parte de um tema concreto para mostrar a engenharia que existe por trás dele.
  - >-
    O programa funciona como ponte entre quem estuda, quem produz e quem usa, num formato
    que dispensa o jargão técnico sem abrir mão do rigor.

