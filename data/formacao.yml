# Cursos, palestras, seminários e demais atividades de formação promovidas ou trazidas pelo NEAB.
# Acrescente um item por atividade. O site agrupa por ano, do mais recente para o mais antigo.
#
# Campos:
#   ano         obrigatório, usado para agrupar e ordenar
#   data        como aparece no registro: "Junho de 2017", "12 de março de 2024"
#   titulo      nome da atividade
#   tipo        curso | palestra | seminário | oficina | mostra  (aparece como etiqueta)
#   ministrante quem conduziu, com o título profissional
#   texto       descrição curta, opcional
#   promocao    quem promoveu, quando não foi o próprio NEAB
#   papel       realização | participação  (padrão: realização)
#   local       onde ocorreu, opcional
#   parceria    entidades parceiras, opcional
#   fonte       de onde veio a informação, opcional

