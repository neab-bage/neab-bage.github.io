periodo: "2019/2021"
inicio: 2019
fim: 2021

posse:
  data: "8 de julho de 2019, às 20h"
  local: "Câmara de Vereadores de Bagé"
  nota: >-
    Sessão solene dupla: homenagem ao NEAB pelos cinquenta anos de fundação e posse da nova
    diretoria. A cerimônia contou com a presença da então presidente do CREA-RS,
    Eng.ª Civil Alice Helena Coelho Sholl.

fonte: "Convite da sessão solene e recorte de jornal, acervo do NEAB"
observacao: >-
  O convite da sessão solene chama o mandato de "gestão 19/20"; confirmar se o biênio correto é
  2019/2020 ou 2019/2021. Os títulos profissionais de cada integrante não constam do recorte e
  não foram preenchidos para não haver suposição.

