# Quadro de associados em dia, conforme o guia Aprova Fácil (setembro de 2026), que é o
# parâmetro oficial do núcleo: todos os associados em dia constam dele.
#
# A relação do guia se divide em duas partes, e o quadro aqui reúne as duas:
#   1. a listagem profissional por modalidade (engenheiros civis, arquitetos etc.);
#   2. a seção da diretoria e do conselho fiscal, onde constam os dirigentes — que não se
#      repetem na listagem profissional.
# Os registros no CREA-RS e no CAU vieram da seção da diretoria; os demais estão em branco
# até a secretaria fornecê-los.
#
# CONTATOS: o núcleo entende que e-mail e telefone aqui são o contato PROFISSIONAL de cada
# associado e que a divulgação atende ao interesse de quem procura um profissional — a mesma
# finalidade do guia Aprova Fácil, de onde os dados vieram. Por isso são publicados.
# Atenção: o repositório é público e indexado por buscadores, e o histórico do Git guarda tudo
# que já foi commitado. Se alguém pedir a retirada do seu contato, esvazie os campos OU marque
# "autoriza_contato: false" — o site deixa de exibir, mas o dado permanece no histórico.
# O site mostra o contato apenas quando "autoriza_contato: true".
#
# Campos: nome, registro (CREA-RS ou CAU), email, telefone, site, autoriza_contato

ano_referencia: 2026
nota: >-
  Relação dos profissionais associados em dia com o núcleo. Para constar nesta página, associe-se
  e mantenha a contribuição anual em dia.

