# Dados do site do NEAB — edite aqui os textos, a diretoria, os parceiros e os documentos.
# Regra geral: trocar conteúdo pelos dados, não pelo HTML.

nome: NEAB
nome_longo: Núcleo dos Engenheiros e Arquitetos de Bagé
local: Bagé/RS
base_url: "/"            # usado só na página 404. Em Pages de projeto: "/nome-do-repositorio/"

descricao_curta: >-
  O NEAB é a sociedade civil que reúne engenheiros, arquitetos e profissionais de
  especialidades afins da regional do CREA-RS de Bagé para defender o exercício
  profissional e valorizar a engenharia e a arquitetura na região.

fundacao:
  ano: 1968
  confirmado: true
  texto: >-
    O NEAB foi fundado em 20 de agosto de 1968, num período de forte expansão urbana de Bagé,
    quando o município passou a exigir planejamento qualificado, modernização das edificações e
    ampliação da infraestrutura. A primeira sede ficava na Galeria Kalil, sala 7. Os estatutos da
    sociedade foram publicados no Diário Oficial do
    Estado em 30 de julho de 1970 e registrados no Cartório de Registro de Bagé em 3 de setembro
    do mesmo ano. Desde então, o núcleo se firmou como referência regional na defesa da boa
    técnica e na valorização profissional.
  estatutos_publicacao: "30 de julho de 1970, no Diário Oficial do Estado"
  estatutos_registro: "3 de setembro de 1970, no Cartório de Registro de Bagé"
  fundadores: [Ernesto Rebouças, Nêd Medina Quintana, Danilo Malafaia Barreto,
               Ney Mário Mércio Carneiro, José Genovese, Glênio Mércio Carneiro, Waldir Alves Ramos]

finalidade: >-
  Proteger e defender os interesses profissionais dos associados e valorizar o exercício
  das profissões de engenharia e arquitetura, sem finalidade econômica, com objetivos
  voltados à promoção de atividades de relevância pública e social.

abrangencia: "Municípios da regional do CREA-RS de Bagé"

# Mantido como dado do estatuto, mas não exibido no site.
ressalva_estatutaria: >-
  O NEAB não pode ser usado em questões de natureza político-partidária, religiosa ou racial.

sede:
  endereco: "Rua Alan Kardec, nº 177 — Loja 01"
  cidade: "Bagé/RS"
  cep: "96402-080"
  complemento: "Nas dependências da Inspetoria do CREA-RS de Bagé"

contato:
  email: "neabbage@gmail.com"
  telefone: ""           # PENDENTE: telefone ou WhatsApp de contato
  instagram: "https://www.instagram.com/neabbage/"
  facebook: ""           # PENDENTE: confirmar o perfil "neab.bage" citado no guia Aprova Fácil

# ATENÇÃO, número de associados: o guia Aprova Fácil de setembro de 2026 lista 46 profissionais
# (23 arquitetos, 13 engenheiros civis, 7 de segurança do trabalho, 2 eletricistas, 1 mecânico;
# quem tem dupla titulação pode aparecer duas vezes). Já o Jornal Minuano, em dez/2024, falou em
# "mais de 220 membros ativos". Os dois números não batem — confirmar com a secretaria antes de
# divulgar qualquer um deles. Enquanto isso, a faixa não exibe contagem de associados.
numeros:
  - {valor: "1968", rotulo: "ano de fundação"}
  - {valor: "58", rotulo: "anos de atuação na Campanha"}
  - {valor: "5", rotulo: "especialidades no quadro de associados"}

# ------------------------------------------------------------------ governança

governanca:
  intro: >-
    A administração do NEAB compete à Diretoria e ao Conselho Fiscal, e a Assembleia Geral
    é o órgão máximo da entidade. Os mandatos duram dois anos e os cargos são exercidos
    gratuitamente.
  orgaos:
    - titulo: "Assembleia Geral"
      texto: >-
        Órgão máximo do NEAB, constituída pelos associados no pleno gozo de seus direitos.
        Reúne-se anualmente em sessão ordinária, nos 30 dias seguintes ao encerramento do
        exercício financeiro, para apreciar o relatório e as contas do exercício anterior, e
        em sessão extraordinária sempre que convocada por edital.
    - titulo: "Diretoria"
      texto: >-
        Composta por Presidente, Vice-Presidente, Secretário e Tesoureiro, eleitos por voto
        secreto. Dirige e administra a entidade, executa as decisões da Assembleia Geral,
        propõe o orçamento anual e organiza o relatório anual.
    - titulo: "Conselho Fiscal"
      texto: >-
        Três membros titulares e três suplentes, eleitos por voto secreto. Opina sobre o
        desempenho financeiro e contábil e sobre as operações patrimoniais, e pode examinar
        a escrituração da entidade em qualquer época.

