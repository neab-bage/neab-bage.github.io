  - {valor: "2", rotulo: "anos de mandato"}
  - {valor: "1", rotulo: "regional do CREA-RS"}

# ------------------------------------------------------------------ governança

governanca:
  intro: >-
    A administração do NEAB compete à Diretoria e ao Conselho Fiscal, e a Assembleia Geral
    é o órgão máximo da entidade. Os mandatos duram dois anos e os cargos são exercidos
    gratuitamente.
  orgaos:
    - titulo: "Assembleia Geral"
      texto: >-
        Órgão máximo do NEAB, constituída pelos associados no pleno gozo de seus direitos.
        Reúne-se anualmente em sessão ordinária, nos 30 dias seguintes ao encerramento do
        exercício financeiro, para apreciar o relatório e as contas do exercício anterior, e
        em sessão extraordinária sempre que convocada por edital.
    - titulo: "Diretoria"
      texto: >-
        Composta por Presidente, Vice-Presidente, Secretário e Tesoureiro, eleitos por voto
        secreto. Dirige e administra a entidade, executa as decisões da Assembleia Geral,
        propõe o orçamento anual e organiza o relatório anual.
    - titulo: "Conselho Fiscal"
      texto: >-
        Três membros titulares e três suplentes, eleitos por voto secreto. Opina sobre o
        desempenho financeiro e contábil e sobre as operações patrimoniais, e pode examinar
        a escrituração da entidade em qualquer época.

# ------------------------------------------------------------------ diretoria

diretoria:
  biennio: "2027/2028"
  eleicao: >-
    Eleita por aclamação na Assembleia Geral Eletiva de 20 de julho de 2026, na sede da
    Inspetoria Regional do CREA-RS em Bagé, após a inscrição de chapa única.
  membros:
    - {cargo: "Presidente", nome: "Cecília Nunes Vieira Lacerda da Luz", titulo: "Arq."}
    - {cargo: "Vice-Presidente", nome: "Aliane Pedroso da Croce", titulo: "Eng.ª Civil"}
    - {cargo: "Secretário", nome: "Bruno Ferreira Saliba", titulo: "Arq."}
    - {cargo: "Tesoureiro", nome: "Bruno Dias Robaina", titulo: "Eng. Civil"}

conselho_fiscal:
  biennio: "2027/2028"
  nota: "PENDENTE: nomes dos três titulares e três suplentes."
  titulares: []
  suplentes: []

# Representantes do NEAB junto ao CREA-RS (Art. 10 do Estatuto).
representacao_crea:
  nota: "PENDENTE: nomes do titular, do suplente e do substituto de suplente."
  membros: []
  texto: >-
    Os representantes do NEAB junto ao CREA-RS — titular, suplente e substituto de suplente —
    são eleitos pela Assembleia Geral, como os demais cargos, para mandato de dois anos.

gestoes_anteriores:
