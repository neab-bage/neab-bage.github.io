           arquivo: "", resumo: "PENDENTE: publicar versão sem os dados pessoais da assinatura digital."}

transparencia:
  intro: >-
    O Art. 35 do Estatuto determina que o NEAB dê publicidade, no encerramento do exercício
    fiscal, ao relatório de atividades e às demonstrações financeiras, com as certidões
    negativas de débitos, à disposição de qualquer cidadão.
  compromissos:
    - "Observar os princípios fundamentais de contabilidade e as Normas Brasileiras de Contabilidade."
    - "Publicar, no encerramento de cada exercício fiscal, o relatório de atividades e as demonstrações financeiras."
    - "Disponibilizar as certidões negativas de débitos com a Previdência Social e com o FGTS."
  exercicios: []         # PENDENTE: {ano, relatorio: arquivo.pdf, demonstracoes: arquivo.pdf, parecer: arquivo.pdf}

