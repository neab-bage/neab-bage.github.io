# ------------------------------------------------------------------ atuação

atuacao:
  chamada: >-
    O NEAB existe para qualificar o exercício da engenharia e da arquitetura na regional de
    Bagé e para levar esse conhecimento técnico ao debate público da cidade.
  frentes:
    - titulo: "Representação profissional"
      icone: balanca
      texto: >-
        Defesa dos interesses profissionais dos associados junto ao sistema CONFEA/CREA, com
        assento no plenário do CREA-RS, e interlocução permanente com o poder público municipal.
    - titulo: "Produção técnica"
      icone: documento
      texto: >-
        Projetos estruturais, vistorias em edificações e perícias judiciais realizados pelos
        profissionais associados.
    - titulo: "Debate urbano"
      icone: local
      texto: >-
        Promoção de debates sobre urbanismo, patrimônio, habitação e infraestrutura, e defesa do
        patrimônio histórico e cultural de Bagé.
    - titulo: "Formação"
      icone: livro
      texto: >-
        Cursos, palestras e mostras técnicas para a qualificação permanente dos profissionais
        da região.
    - titulo: "Assessoria ao poder público"
      icone: maos
      texto: >-
        Apoio técnico à administração municipal na análise de projetos e na formulação de
        políticas urbanas.
    - titulo: "Comunicação com a sociedade"
      icone: jornal
      texto: >-
        Informação à população sobre obras e manutenção predial, pelo programa de rádio
        Universos da Engenharia e pelo caderno mensal Ellas Revista — Projeto & Construção.
  realizacoes:
    - ano: "2024"
      data: "10 de dezembro de 2024"
      titulo: "Sala do Profissional"
      texto: >-
        Inaugurada pelo NEAB e pela Mútua-RS, com a Prefeitura de Bagé, é a primeira sala de
        engenheiros e arquitetos instalada dentro de uma prefeitura municipal no país. Equipada
        para a análise de projetos junto à Secretaria de Planejamento, permite abrir plantas
        digitais e ajustar detalhes com o projetista na hora, dando agilidade à tramitação dos
        processos e qualificando o atendimento aos profissionais.
      link: "https://www.instagram.com/neabbage/reel/DDamEOWSYc1/"
      link_rotulo: "Registro da inauguração"
    - ano: "2025"
      titulo: "Universos da Engenharia"
      texto: >-
        Programa semanal na Rádio Pop Rock que leva informação e conhecimento de engenharia à
        comunidade. Conquistou o 2º lugar no Prêmio Destaque Divulga Mútua de 2025, na categoria
        Valorização Profissional.
    - ano: "2026"
      titulo: "Ellas Revista — Projeto & Construção"
      texto: >-
        Caderno mensal publicado no Jornal Minuano e assinado pelo NEAB, com trabalhos dos
        associados, conteúdo técnico e análises urbanas. A primeira edição, em março de 2026,
        homenageou os fundadores do núcleo.
    - ano: "2026"
      titulo: "Café da Manhã do NEAB"
      texto: >-
        Encontros periódicos do núcleo com seus associados, em formato de conversa aberta, com
        convidados de dentro e de fora das profissões. Em 2026 as edições trataram do papel dos
        profissionais na construção das cidades, do respeito e do combate ao assédio no ambiente
        de trabalho, e de sistemas construtivos, em visita técnica a uma obra. As edições ficam
        registradas na página de cursos e formação.
    - ano: "2026"
      data: "Em andamento, desde outubro de 2026"
      titulo: "Um olhar sobre o Arroio Bagé"
      texto: >-
        Estudo de reconhecimento do território do Arroio Bagé, iniciado com saídas de campo que
        reúnem profissionais do núcleo e a GEPLAN, da Prefeitura de Bagé. A leitura do território
        — ambiental, histórica e paisagística — busca subsidiar propostas de preservação e
        ordenamento que também representem oportunidade de desenvolvimento para a cidade.
    - ano: "2026"
      titulo: "Grupo Aliança Bagé"
      texto: >-
        O núcleo integra a articulação das entidades da classe produtiva de Bagé, que leva às
        autoridades pautas de patrimônio histórico, organização urbana e desenvolvimento local.

# ------------------------------------------------------------------ associe-se

associar:
  chamada: >-
    Associar-se ao NEAB é somar-se a um grupo que representa a engenharia e a arquitetura
    da região junto ao CREA-RS, acompanha as questões do exercício profissional e organiza
    formação, eventos e convênios para os profissionais de Bagé e da regional.
  quem_pode:
    - "Profissionais da engenharia e da arquitetura registrados no respectivo Conselho."
    - "Profissionais de especialidades afins, de nível superior, regulamentadas pelo CREA-RS."
  como:
    - titulo: "Fale com a Diretoria"
      texto: "Entre em contato pelos canais da página de contato e manifeste o interesse em associar-se."
    - titulo: "Indicação de associado"
      texto: "Qualquer associado pode propor novos associados à Diretoria, conforme o Estatuto."
    - titulo: "Contribuição mensal"
      texto: >-
        Os fundos do NEAB vêm das mensalidades dos associados. O valor é proposto anualmente
        pelo Conselho Fiscal e aprovado pela Assembleia Geral, na prestação de contas.
  mensalidade: ""        # PENDENTE: valor vigente e forma de pagamento, se puder ser público
  direitos:
    - "Frequentar a sede do núcleo."
    - "Participar das Assembleias Gerais, congressos e conferências."
    - "Acompanhar as reuniões do Conselho Fiscal e discutir pareceres e trabalhos técnicos."
    - "Apresentar conferências e trabalhos técnicos no núcleo, com anuência da Diretoria."
    - "Propor questões para estudo, relacionadas às finalidades do núcleo."
    - "Votar e ser votado para os cargos eletivos."
    - "Propor novos associados."
    - "Integrar as comissões técnicas do núcleo."
  deveres:
    - "Manter em dia a contribuição mensal."
    - "Observar o Estatuto Social e o Código de Ética Profissional."

